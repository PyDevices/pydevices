name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pdwidgets.toml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pdwidgets.toml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pydevices
          path: pydevices
          sparse-checkout: |
            lib
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pygraphics
          path: pygraphics
          sparse-checkout: |
            lib/pygraphics
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/palettes
          path: palettes
          sparse-checkout: |
            lib/palettes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: lib:tests/stubs:pydevices/lib:pygraphics/lib:palettes/lib
        run: python -m unittest discover -s tests

  validate-pyscript-filesystem-toml:
    uses: PyDevices/.github/.github/workflows/reusable-validate-pyscript-filesystem-toml.yml@publishing-v6
    with:
      config-path: pdwidgets.toml
      source-mappings: lib=/lib
