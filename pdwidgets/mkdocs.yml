site_name: pdwidgets
site_url: https://pdwidgets.readthedocs.io
repo_url: https://github.com/PyDevices/pdwidgets/
edit_uri: edit/main/docs/
copyright: "Copyright 2024–2026, Brad Barnett & PyDevices Contributors"
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - assets/pyscript/pydevices-runner.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PyDevices/pdwidgets
    - icon: fontawesome/brands/python
      link: https://test.pypi.org/project/pydevices-pdwidgets/
    - icon: fontawesome/solid/globe
      link: https://pydevices.github.io

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/mkdocs_gen_ref_pages.py
  - literate-nav:
      nav_file: summary.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [lib]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            docstring_options:
              # Convention (dotgithub/docs/docstrings.md) documents bare
              # `Returns:\n    Type: description`. Griffe's default
              # (returns_named_value: true) requires the type in parens
              # (`(Type): description`) and otherwise reads a bare leading
              # word as the return *name*, producing a false-positive
              # "no type" warning under --strict. This makes the bare
              # `type: description` form the expected one.
              returns_named_value: false
            merge_init_into_class: true
            filters:
              - "!^_"
