# Read the Docs builds this site from the pydevices repository, with this
# file as the project's configuration file (Settings, "Path for
# .readthedocs.yaml": pdwidgets/.readthedocs.yaml). Paths here are relative to the
# repository root, not to this folder.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: pdwidgets/docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: pdwidgets/docs/requirements.txt
