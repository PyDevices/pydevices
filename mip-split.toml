# Which modules in lib/ cannot run on a microcontroller, and which packages in
# lib/ publish to MIP on their own instead of inside `pydevices` (`own-package`,
# bledev), and which top-level directories publish to MIP under their own name
# (`top-level`, at the end: midiports and the usb-* packages).
#
# `displaydev`, `audiodev` and `multimer` each carry a full set of platform
# backends and pick one at import time through their `auto` module. That design
# is right and is not what this file is about: the question here is only what
# gets *shipped* to a device. Installing a board config onto an ESP32-S3 used to
# pull `windisplay`, `jndisplay`, `wasmdisplay`, `pgdisplay`, `sdldisplay`,
# `androidsdl`, `win_audio`, `pygame_audio`, `wasm_audio`, `web_audio`,
# `sdl2_audio`, `android_audio`, `win32`, `sdl2`, `threading` and `wasm` — about
# half of what landed, none of it able to execute, all of it minutes of install
# time over WiFi and flash that could hold something (pydevices#30).
#
# Every module named here ships in **pydevices-desktop** instead, which already
# `require("pydevices")`, so a desktop, browser or Android host gets exactly what
# it got before, in one install, at the same import paths. An MCU gets the rest.
#
# `auto.py` stays in the MCU package in every case. Its host branches import
# inside the function, never at module scope, so importing it on a board is fine;
# calling `AutoDisplay()` there was never the intent ("board configs stay
# MCU-shaped wiring only" — displaydev/auto.py).
#
# **The rules the publisher enforces**, so this file cannot rot quietly:
# a name here that no longer exists fails the sync, and a new module in one of
# these packages ships to the MCU unless it is added here — so the failure mode
# of forgetting is a device carrying one file too many, never a host missing one.
# It also refuses to publish if an MCU-side module imports a host-only one at
# module scope.

[displaydev]
# SDL, pygame, Windows GDI, Jupyter, PyScript, the browser canvas, Android.
# `_desktop`, `_domkeys`, `_webcanvas` and `_webinput` are shared helpers for
# those and nothing else.
host-only = [
    "_desktop",
    "_domkeys",
    "_webcanvas",
    "_webinput",
    "androidsdl",
    "jndisplay",
    "pgdisplay",
    "psdisplay",
    "sdldisplay",
    "wasmdisplay",
    "windisplay",
    "workerdisplay",
]

[audiodev]
# Host mixers and the three browser backends. `i2s_audio`, `pwm_tone`,
# `sample_out`, `accel` and `pump` are the MCU's, and `emulated_audio` stays
# with them: it is never selected by `auto`, is imported explicitly, and builds
# on audiodev's own PCM classes with no host dependency.
host-only = [
    "android_audio",
    "pygame_audio",
    "sdl2_audio",
    "wasm_audio",
    "web_audio",
    "win_audio",
    "worklet_audio",
]

[multimer]
# The wake sources and the REPL hook that only a desktop, phone or browser
# host can use: `_inputhook` (CPython's PyOS_InputHook), `_src_pending`
# (CPython's worker thread + Py_AddPendingCall), `_src_signal` (POSIX timer
# signals: CPython and unix MicroPython), `_src_native` (the windows port's
# `_timing` helper) and `_src_wasm` (the browser). Boards keep the dispatcher,
# `_hostloop`, `_repl`, `_ticks`, `_src_machine`, `_src_none`, `_src_asyncio`
# and the asyncio loaders.
host-only = [
    "_inputhook",
    "_src_native",
    "_src_pending",
    "_src_signal",
    "_src_wasm",
]

[bledev]
# BLE is its own MIP package rather than part of `pydevices`, so a board
# without a radio doesn't carry it (docs/guides/bluetooth-le.md):
#     mip.install("bledev", index="https://PyDevices.github.io/mip")
# bledev needs micropython-lib's aioble, and declares no dependency on it:
# mip takes every file of a package from the one index it was given, so an
# index can't depend on another one. Install aioble from micropython-lib first
# (bledev's docs show the line); firmware that freezes aioble needs no step.
own-package = true
# The central-only host backends go in pydevices-desktop, as for the other
# packages here. A name listed before its file exists fails the sync.
host-only = ["bleak", "webble"]
# On PyPI bledev stays inside the pydevices wheel. bleak is optional, behind
# `pip install "pydevices[ble]"`.
pypi-extras = { ble = ["bleak>=1.0"] }

[medialink]
# Board-to-board audio and video is its own MIP package, as BLE is, so a
# board that never streams doesn't carry it:
#     mip.install("medialink", index="https://PyDevices.github.io/mip")
# It needs no other package. Discovery uses the firmware's mdns module, and
# the intercom takes any audiodev microphone and speaker it is handed.
own-package = true

# midiports and the USB packages are directories at the top of the repository,
# not in lib/, each with its own manifest.py. `top-level = true` publishes that
# directory to the index under its own name, so a board installs it with
#     mip.install("usb-host-msc", index="https://PyDevices.github.io/mip")
# and a board config can require() it by name. The manifest.py is the single
# source for what a package is, requires and ships: the publisher reads it, and
# a firmware build freezes the same file. Only the version changes. The index
# carries the release's version, not the 0.1.0 in the manifest, so every
# PyDevices package in it is at the same number. A section takes no other keys.
#
# A package that require()s another here (usb-host-msc needs usb-core) must have
# that one listed too; the publisher refuses to sync otherwise, and
# tests/test_mip_split.py refuses a directory with a manifest.py that is missing
# from this list. package.json is for installing straight from GitHub and is
# not published.
#
# midiports reaches the index without Adafruit's adafruit_midi, which is not a
# package in any mip index: install it as midiports/README.md says.

[midiports]
top-level = true

[hmilink]
top-level = true

[usb-core]
top-level = true

[usb-hid]
top-level = true

[usb-host-audio]
top-level = true

[usb-host-cdc]
top-level = true

[usb-host-hid]
top-level = true

[usb-host-msc]
top-level = true

[usb-host-mtp]
top-level = true

[usb-host-net]
top-level = true

[usb-host-video]
top-level = true

[usb-device-audio]
top-level = true

[usb-device-msc]
top-level = true

[usb-device-video]
top-level = true
