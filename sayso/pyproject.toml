[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sayso"
dynamic = ["version"]
description = "Lightweight Spotify Web API client experiments for CPython, MicroPython, and CircuitPython"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Brad Barnett" }]
urls = { Homepage = "https://github.com/PyDevices/pydevices/tree/main/sayso", Issues = "https://github.com/PyDevices/pydevices/issues" }
keywords = ["spotify", "web-api", "micropython", "circuitpython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
schema = ["PyYAML"]

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.exclude-package-data]
sayso = ["generated_object_specs.py"]
