[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-synthstation"
dynamic = ["version"]
description = "Pick an instrument and play it from a MIDI keyboard, with a hardware-style control panel and a live render-load readout"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Brad Barnett" }]
dependencies = [
  # The panel, and the instruments it plays. MIDI comes from midiports,
  # which isn't on PyPI: without it the panel's pads play the notes.
  "pydevices-controlpanel",
  "omnipython-audioinstruments",
]
urls = { Homepage = "https://github.com/PyDevices/pydevices/tree/main/synthstation", Issues = "https://github.com/PyDevices/pydevices/issues" }

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
