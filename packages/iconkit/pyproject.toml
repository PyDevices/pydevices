[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-iconkit"
dynamic = ["version"]
description = "Material Design icons as flash-resident alpha masks, drawn in LVGL or pygraphics"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-ICONS"]
requires-python = ">=3.8"
authors = [{ name = "Brad Barnett" }]
keywords = ["icons", "material", "lvgl", "micropython", "circuitpython"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
]
urls = { Homepage = "https://github.com/PyDevices/pydevices/tree/main/packages/iconkit", Issues = "https://github.com/PyDevices/pydevices/issues" }

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-data]
iconkit = ["icons_*.txt"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
lint.select = ["E", "F", "I", "W", "B", "SIM", "PLC0415"]
lint.ignore = ["E501", "SIM108", "F401", "F403", "F405", "ISC003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "E402"]
"tools/**" = ["E402"]
