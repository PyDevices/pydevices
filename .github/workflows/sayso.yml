# sayso's tests. A change under sayso/ runs them. They are offline: the
# client, objects and transport tests mock the HTTP layer, and the live tests
# skip themselves without a sayso.local.json. The MicroPython and CircuitPython
# runs are local (sayso/AGENTS.md).
name: sayso

on:
  push:
    branches: [main]
    paths:
      - 'sayso/**'
      - '.github/workflows/sayso.yml'
  pull_request:
    paths:
      - 'sayso/**'
      - '.github/workflows/sayso.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sayso

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The one HTTP client sayso imports on CPython.
      - name: Install requests
        run: python -m pip install requests
      - name: Unit tests
        env:
          PYTHONPATH: lib
        run: python -m unittest discover -s tests -v
      - name: The wheel builds and imports
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install requests "$RUNNER_TEMP"/dist/sayso-*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -c "import sayso, sayso.client; print(sayso.__file__)"
