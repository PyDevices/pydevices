name: Package library

# Builds the mip index and the library tree with tools/libbuild.py: this
# repository's packages from the checkout (palettes, pdwidgets, appkit, controlpanel and sayso at
# the versions in their folders, every board config and driver), and the
# packages lib-lock.json pins from other repositories at their tags. A
# packaging mistake (a mip-split.toml name that no longer exists, a manifest
# naming a missing file, a module that imports a host-only one at module
# scope) fails here, in the pull request.
#
# The shape check runs first: it is what a board or driver contribution has
# to pass (CONTRIBUTING.md). It fails on a require() that names no package,
# here or in micropython-lib; on a package name micropython-lib already uses;
# on a driver a board imports but doesn't require; on a driver file in no
# package; and on a package.json that wasn't written from its manifest.py.

on:
  push:
    branches:
      - main
    paths:
      - 'tools/libbuild.py'
      - 'lib-lock.json'
      - 'mip-split.toml'
      - 'VERSION'
      - 'lib/**'
      - 'utils/**'
      - 'board_configs/**'
      - 'drivers/**'
      - 'midiports/**'
      - 'usb-*/**'
      - 'palettes/lib/**'
      - 'palettes/VERSION'
      - 'pdwidgets/lib/**'
      - 'pdwidgets/VERSION'
      - 'appkit/lib/**'
      - 'appkit/VERSION'
      - 'controlpanel/lib/**'
      - 'controlpanel/VERSION'
      - 'sayso/lib/**'
      - 'sayso/VERSION'
      - '.github/workflows/lib-index.yml'
  pull_request:
    paths:
      - 'tools/libbuild.py'
      - 'lib-lock.json'
      - 'mip-split.toml'
      - 'VERSION'
      - 'lib/**'
      - 'utils/**'
      - 'board_configs/**'
      - 'drivers/**'
      - 'midiports/**'
      - 'usb-*/**'
      - 'palettes/lib/**'
      - 'palettes/VERSION'
      - 'pdwidgets/lib/**'
      - 'pdwidgets/VERSION'
      - 'appkit/lib/**'
      - 'appkit/VERSION'
      - 'controlpanel/lib/**'
      - 'controlpanel/VERSION'
      - 'sayso/lib/**'
      - 'sayso/VERSION'
      - '.github/workflows/lib-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The bytecode version every board reads today (mpy v6.3).
      - name: Install mpy-cross
        run: python -m pip install mpy-cross==1.29.0.post2

      - name: Check the board and driver packages' shape
        run: |
          python tools/libbuild.py check
          python tools/libbuild.py installers --check

      - name: Build the library tree and the index
        run: python tools/libbuild.py build --out build/lib

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: package-library
          path: build/lib
          retention-days: 14
