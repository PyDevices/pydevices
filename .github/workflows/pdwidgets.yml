# pdwidgets' own checks: its tests, its docs site as Read the Docs builds it,
# and its PyScript filesystem TOML. A change under packages/pdwidgets/ runs them, and
# so does a change to what it imports from this repository (lib/, packages/palettes/).
name: pdwidgets

on:
  push:
    branches: [main]
    paths:
      - 'packages/pdwidgets/**'
      - 'packages/palettes/lib/**'
      - 'lib/**'
      - '.github/workflows/pdwidgets.yml'
  pull_request:
    paths:
      - 'packages/pdwidgets/**'
      - 'packages/palettes/lib/**'
      - 'lib/**'
      - '.github/workflows/pdwidgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pdwidgets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pygraphics
          path: pygraphics
          sparse-checkout: |
            lib/pygraphics
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: lib:tests/stubs:../lib:../palettes/lib:../pygraphics/lib
        run: python -m unittest discover -s tests

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # From the repository root with packages/pdwidgets/.readthedocs.yaml's paths, the
    # way Read the Docs runs it. -W turns a warning into a failure, as
    # fail_on_warning does there.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install docs requirements
        run: pip install -r packages/pdwidgets/docs/requirements.txt
      - name: Build docs
        run: sphinx-build -W --keep-going -b html packages/pdwidgets/docs _site/pdwidgets

  validate-pyscript-filesystem-toml:
    uses: PyDevices/.github/.github/workflows/reusable-validate-pyscript-filesystem-toml.yml@publishing-v14
    with:
      config-path: packages/pdwidgets/pdwidgets.toml
      source-mappings: packages/pdwidgets/lib=/lib
