name: Unit tests

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'utils/**'
      - 'drivers/**'
      - 'board_configs/**/package.json'
      # The contract proof (tests/test_contract_proof.py) reads and binds every
      # board's board_config.py and board_peripherals.py, so a change to those
      # must run the suite. The t-embed rail-power regression reached main
      # untested because only package.json under board_configs was watched.
      - 'board_configs/**/board_config.py'
      - 'board_configs/**/board_peripherals.py'
      - 'scripts/validate_board_mip_installers.py'
      # test_desktop_publication asserts this file lists every source under
      # lib/ and utils/, so a change to it has to run the suite. Without this
      # the assertion only fires when something ELSE changes: the wifi.py move
      # left the TOML stale, and the fix could not trigger its own test.
      - 'pydevices-desktop.toml'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'utils/**'
      - 'drivers/**'
      - 'board_configs/**/package.json'
      # The contract proof (tests/test_contract_proof.py) reads and binds every
      # board's board_config.py and board_peripherals.py, so a change to those
      # must run the suite. The t-embed rail-power regression reached main
      # untested because only package.json under board_configs was watched.
      - 'board_configs/**/board_config.py'
      - 'board_configs/**/board_peripherals.py'
      - 'scripts/validate_board_mip_installers.py'
      # test_desktop_publication asserts this file lists every source under
      # lib/ and utils/, so a change to it has to run the suite. Without this
      # the assertion only fires when something ELSE changes: the wifi.py move
      # left the TOML stale, and the fix could not trigger its own test.
      - 'pydevices-desktop.toml'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install SDL runtime
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0

      - name: Run stdlib unittest suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

      - name: Validate direct-GitHub board installers
        run: python scripts/validate_board_mip_installers.py

  # The audio pump's C half. `lib/audiodev/pump.py` decides things CPython
  # can be shown deciding (tests/test_pump.py, with stand-ins), but whether
  # the pump's own thread produces the SAME BYTES as the old pull, and
  # whether a hundred play/stop rounds leave it clean, needs the real engine
  # on a real interpreter. So this job builds one.
  #
  # It needs audiodsp and nothing else: `audiopump` the engine ships with
  # audiodsp on every port, and the platform driver (a private repo today) is
  # optional -- without it `threaded()` is False and the same loop runs on
  # the interpreter's own thread, which both probes pass on. That is what
  # makes this job possible in a public repository at all.
  #
  # PYDEVICES_REQUIRE_PUMP=1 is the point of the job: without it the tests
  # skip, loudly but greenly, which is what they do in the unittest job
  # above on a runner with no interpreter.
  #
  # ORDERING: audiodsp has to carry the pump on its default branch before
  # this can go green -- it arrives with the live-audio-path line.
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: pydevices

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audiodsp
          path: audiodsp

      - name: Fetch audiodsp's pinned dependencies
        working-directory: audiodsp
        run: ./scripts/fetch_deps.sh

      - uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: micropython

      # USER_C_MODULES is the PARENT directory: py.mk globs
      # $(USER_C_MODULES)/*/micropython.mk exactly one level down, which is
      # how audiodsp's own clean-build workflow does it too.
      - name: Build the unix port with the audiodsp usermod
        run: |
          make -C micropython/mpy-cross -j2
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j2 \
            USER_C_MODULES=$GITHUB_WORKSPACE

      - name: The pump probes, with their planted faults
        working-directory: pydevices
        env:
          PYDEVICES_PUMP_INTERPRETER: >-
            ${{ github.workspace }}/micropython/ports/unix/build-standard/micropython
          PYDEVICES_REQUIRE_PUMP: '1'
        run: python -m unittest tests.test_pump_interpreter -v
