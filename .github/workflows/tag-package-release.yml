# The packages that keep a version of their own (palettes, pdwidgets,
# controlpanel) release
# apart from pydevices. A merged pull request that changes <name>/VERSION
# becomes the <name>-vX.Y.Z tag and a GitHub Release, created with the App
# token so that publish-package-release.yml runs. A VERSION file that is new
# in the push (a package moving in) is not a release.
name: Tag package release

on:
  push:
    branches: [main]
    paths:
      - 'palettes/VERSION'
      - 'pdwidgets/VERSION'
      - 'controlpanel/VERSION'

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [palettes, pdwidgets, controlpanel]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect a VERSION change
        id: detect
        env:
          PACKAGE: ${{ matrix.package }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ -z "$(git diff --diff-filter=M --name-only "$BEFORE" HEAD -- "$PACKAGE/VERSION")" ]]; then
            echo "$PACKAGE/VERSION did not change in this push"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(tr -d '[:space:]' < "$PACKAGE/VERSION")
          # The grammar the build and the publish accept; anything else is
          # refused rather than burned into a tag.
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::$PACKAGE/VERSION is '$V', not a release version X.Y.Z[{a|b|rc}N|.devN]; refusing to tag."
            exit 1
          fi
          TAG="$PACKAGE-v$V"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The release notes: this version's section of the package's CHANGELOG.
          awk -v v="$V" '
            /^## / { if (found) exit; if ($0 ~ "^## v?" v "( |$)") { found = 1; next } }
            found { print }
          ' "$PACKAGE/CHANGELOG.md" > notes.md
          [[ -s notes.md ]] || echo "$PACKAGE $V" > notes.md
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Mint App token
        if: steps.detect.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}

      # --latest=false: the repository's "latest release" stays pydevices'.
      - name: Create tag and Release
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          V: ${{ steps.detect.outputs.version }}
          TAG: ${{ steps.detect.outputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          PRERELEASE=""
          [[ "$V" =~ (a|b|rc)[0-9]+$|\.dev[0-9]+$ ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$PACKAGE $V" \
            --notes-file notes.md --latest=false $PRERELEASE
