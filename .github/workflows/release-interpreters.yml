# The interpreters attached to a final release: micropython (Linux),
# micropython.exe (Windows), micropython.mjs and micropython.wasm (browser and
# Node), and circuitpython (Linux), each with every PyDevices module, plus the
# interpreters.json manifest that bin/fetch_interpreters.sh checks them against.
# The release notes get one line saying which MicroPython and CircuitPython the
# interpreters are built on, and when either is a preview.
#
# A final release (vX.Y.Z) builds and attaches them. A dev, a, b or rc release
# gets none. Every build comes from the release's own tag, with the
# micropython-pydevices and lvgl-circuitpython commits that
# scripts/release_interpreters/sources.lock pins, and the manifest lists every
# source commit that went in. Move the pins before a final with
# scripts/release_interpreters/sources.py bump (CONTRIBUTING.md).
#
# By hand: Actions > Release interpreters > Run workflow builds every
# interpreter from the branch or tag you name and keeps them as a run artifact,
# attaching nothing. Tick "attach" with a final tag to (re)attach to that
# release; that always uses the pins. To try another micropython-pydevices or
# lvgl-circuitpython, name it in the two inputs below, and the run attaches
# nothing. Changes to this recipe run the same builds on their pull request.
name: Release interpreters

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (empty builds the branch this runs on)
        default: ""
        type: string
      attach:
        description: Attach to that tag's GitHub Release (a final vX.Y.Z tag only)
        default: false
        type: boolean
      micropython-pydevices-ref:
        description: micropython-pydevices branch, tag or commit to build with (empty uses the pin in sources.lock; never attached)
        default: ""
        type: string
      lvgl-circuitpython-ref:
        description: lvgl-circuitpython branch, tag or commit for the CircuitPython build (empty uses the pin in sources.lock; never attached)
        default: ""
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-interpreters.yml'
      - 'scripts/release_interpreters.sh'
      - 'scripts/release_interpreters/**'
      - 'bin/upload_interpreters.sh'

permissions:
  contents: read

# bash with -eo pipefail, so a failing gate is not hidden by the tee after it.
defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      attach: ${{ steps.gate.outputs.attach }}
      tag: ${{ steps.gate.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}
      mpp: ${{ steps.gate.outputs.mpp }}
      lvgl_cp: ${{ steps.gate.outputs.lvgl_cp }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether this run builds and whether it attaches
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ATTACH: ${{ inputs.attach }}
          INPUT_MPP: ${{ inputs.micropython-pydevices-ref }}
          INPUT_LVGL: ${{ inputs.lvgl-circuitpython-ref }}
        run: |
          case "$EVENT" in
            release) ref="$RELEASE_TAG" ;;
            *) ref="$INPUT_REF" ;;
          esac
          # A pull request and a dispatch build and never attach unless a
          # dispatch asks to and names a final tag.
          scripts/release_interpreters.sh gate "$EVENT" "$ref" "${INPUT_ATTACH:-false}" "$INPUT_MPP" "$INPUT_LVGL" | tee -a "$GITHUB_OUTPUT"
      - name: Say when a pin is behind its default branch
        run: python3 scripts/release_interpreters/sources.py stale
      - name: What to check out
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # The pydevices tree that goes into the interpreters. Empty means
          # the commit this run is on.
          if [[ "$EVENT" == release ]]; then echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [mp-unix, mp-windows, mp-wasm, cp-unix]
    steps:
      # The recipe comes from the commit this run is on; the pydevices that
      # goes into the interpreters comes from the release's tag, which for a
      # retry of an older release is a different tree.
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          path: pydevices
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/micropython-pydevices
          ref: ${{ inputs.micropython-pydevices-ref || needs.gate.outputs.mpp }}
          path: micropython-pydevices
      - name: micropython-pydevices is the pinned commit
        if: inputs.micropython-pydevices-ref == ''
        run: python3 recipe/scripts/release_interpreters/sources.py --lock recipe/scripts/release_interpreters/sources.lock verify micropython-pydevices micropython-pydevices

      - name: Packages the ${{ matrix.target }} build needs
        run: |
          case "${{ matrix.target }}" in
            mp-unix)    pkgs="libsdl2-dev libffi-dev pkg-config" ;;
            mp-windows) pkgs="gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 libtool libltdl-dev autoconf automake" ;;
            mp-wasm)    pkgs="" ;;
            cp-unix)    pkgs="libsdl2-dev libffi-dev pkg-config" ;;
          esac
          if [[ -n "$pkgs" ]]; then
            sudo apt-get update
            sudo apt-get install -y $pkgs
          fi

      - name: CircuitPython's LVGL helpers
        if: matrix.target == 'cp-unix'
        env:
          LVGL_CP_REF: ${{ inputs.lvgl-circuitpython-ref }}
        run: |
          # lvgl-circuitpython at its pin; pdwidgets and palettes are frozen
          # from this release's own library.
          mkdir -p ws && cd ws
          ../recipe/scripts/release_interpreters.sh fetch lvgl-circuitpython lvgl-circuitpython "$LVGL_CP_REF"
          ls

      - name: Build ${{ matrix.target }}
        env:
          MPP_DIR: ${{ github.workspace }}/micropython-pydevices
          PYD_DIR: ${{ github.workspace }}/pydevices
          WS_DIR: ${{ github.workspace }}/ws
        run: recipe/scripts/release_interpreters.sh build "${{ matrix.target }}" out

      - uses: actions/upload-artifact@v7
        with:
          name: interpreter-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  assemble:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The three trees the interpreters were built from, to record their
      # commits: the release's pydevices, and the two pinned sources.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          path: pydevices
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/micropython-pydevices
          ref: ${{ inputs.micropython-pydevices-ref || needs.gate.outputs.mpp }}
          path: micropython-pydevices
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/lvgl-circuitpython
          ref: ${{ inputs.lvgl-circuitpython-ref || needs.gate.outputs.lvgl_cp }}
          path: lvgl-circuitpython
      - uses: actions/download-artifact@v8
        with:
          pattern: interpreter-*
          merge-multiple: true
          path: bin

      - name: Each interpreter starts and carries the modules
        run: |
          # The desktop display's runtime, which the Linux builds link to.
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libffi8
          chmod +x bin/micropython bin/circuitpython
          bin/micropython -c "import sys; print(sys.version); import displaydev, appdev, lvgl, ulab, synthio, audiopump, audiosampler; print('micropython modules ok')"
          bin/circuitpython -c "import sys; print(sys.version); import pygraphics, lvgl; print(sys.implementation.name, 'modules ok')"
          file bin/micropython.exe | tee /dev/stderr | grep -q 'PE32+'
          cd bin && node --input-type=module -e "
            import { loadMicroPython } from './micropython.mjs';
            const mp = await loadMicroPython();
            mp.runPython('import sys; print(sys.version); import displaydev; print(\"wasm ok\")');
          "

      - name: Write interpreters.json
        env:
          TAG: ${{ needs.gate.outputs.tag || 'unreleased' }}
          DRY_RUN: ${{ needs.gate.outputs.attach == 'true' && '0' || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mpp=$(git -C micropython-pydevices rev-parse --short=12 HEAD)
          export PROVENANCE="built by GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_REPOSITORY $GITHUB_SHA with micropython-pydevices $mpp"
          # Every source commit, read from the trees themselves.
          SOURCES_JSON=$RUNNER_TEMP/sources.json
          export SOURCES_JSON
          python3 scripts/release_interpreters/sources.py record --mpp micropython-pydevices \
            --lvgl-circuitpython lvgl-circuitpython --pydevices pydevices \
            --pydevices-ref "${TAG#unreleased}" | tee "$SOURCES_JSON"
          # An attached set is made only from the pins.
          if [[ "$DRY_RUN" == 0 ]]; then
            python3 -c "import json,sys; sys.exit(0 if json.load(open('$SOURCES_JSON'))['pinned'] else 'not built from the pinned sources')"
          fi
          # Writes the manifest; uploads only when this run attaches.
          bin/upload_interpreters.sh "$TAG" --clobber
          cat bin/interpreters.json

      - name: Say in the release notes which MicroPython and CircuitPython these are built on
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          ATTACH: ${{ needs.gate.outputs.attach }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The versions come from the manifest just written. A run that
          # attaches puts the line at the end of the release's notes; any
          # other run only prints it.
          if [[ "$ATTACH" == true ]]; then
            python3 scripts/release_interpreters/notes.py release "$TAG" bin/interpreters.json
          else
            python3 scripts/release_interpreters/notes.py line bin/interpreters.json
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: interpreters
          path: |
            bin/micropython
            bin/micropython.exe
            bin/circuitpython
            bin/micropython.mjs
            bin/micropython.wasm
            bin/interpreters.json
          if-no-files-found: error
