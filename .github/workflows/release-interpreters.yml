# The interpreters attached to a final release: micropython (Linux),
# micropython.exe (Windows), micropython.mjs and micropython.wasm (browser and
# Node), and circuitpython (Linux), each with every PyDevices module, plus the
# interpreters.json manifest that bin/fetch_interpreters.sh checks them against.
#
# A final release (vX.Y.Z) builds and attaches them. A dev, a, b or rc release
# gets none. Every build comes from the release's own tag, with the
# micropython-pydevices and lvgl-circuitpython default branches, and the manifest
# says which commits.
#
# By hand: Actions > Release interpreters > Run workflow builds every
# interpreter from the branch or tag you name and keeps them as a run artifact,
# attaching nothing. Tick "attach" with a final tag to (re)attach to that
# release. Changes to this recipe run the same builds on their pull request.
name: Release interpreters

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (empty builds the branch this runs on)
        default: ""
        type: string
      attach:
        description: Attach to that tag's GitHub Release (a final vX.Y.Z tag only)
        default: false
        type: boolean
      micropython-pydevices-ref:
        description: micropython-pydevices branch, tag or commit to build with
        default: main
        type: string
      lvgl-circuitpython-ref:
        description: lvgl-circuitpython branch, tag or commit for the CircuitPython build
        default: main
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-interpreters.yml'
      - 'scripts/release_interpreters.sh'
      - 'scripts/release_interpreters/**'
      - 'bin/upload_interpreters.sh'

permissions:
  contents: read

# bash with -eo pipefail, so a failing gate is not hidden by the tee after it.
defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      attach: ${{ steps.gate.outputs.attach }}
      tag: ${{ steps.gate.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether this run builds and whether it attaches
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ATTACH: ${{ inputs.attach }}
        run: |
          case "$EVENT" in
            release) ref="$RELEASE_TAG" ;;
            *) ref="$INPUT_REF" ;;
          esac
          # A pull request and a dispatch build and never attach unless a
          # dispatch asks to and names a final tag.
          scripts/release_interpreters.sh gate "$EVENT" "$ref" "${INPUT_ATTACH:-false}" | tee -a "$GITHUB_OUTPUT"
      - name: What to check out
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # The pydevices tree that goes into the interpreters. Empty means
          # the commit this run is on.
          if [[ "$EVENT" == release ]]; then echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [mp-unix, mp-windows, mp-wasm, cp-unix]
    steps:
      # The recipe comes from the commit this run is on; the pydevices that
      # goes into the interpreters comes from the release's tag, which for a
      # retry of an older release is a different tree.
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          path: pydevices
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/micropython-pydevices
          ref: ${{ inputs.micropython-pydevices-ref || 'main' }}
          path: micropython-pydevices

      - name: Packages the ${{ matrix.target }} build needs
        run: |
          case "${{ matrix.target }}" in
            mp-unix)    pkgs="libsdl2-dev libffi-dev pkg-config" ;;
            mp-windows) pkgs="gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 libtool libltdl-dev autoconf automake" ;;
            mp-wasm)    pkgs="" ;;
            cp-unix)    pkgs="libsdl2-dev libffi-dev pkg-config" ;;
          esac
          if [[ -n "$pkgs" ]]; then
            sudo apt-get update
            sudo apt-get install -y $pkgs
          fi

      - name: CircuitPython's frozen Python and widgets
        if: matrix.target == 'cp-unix'
        env:
          LVGL_CP_REF: ${{ inputs.lvgl-circuitpython-ref || 'main' }}
        run: |
          # pdwidgets and palettes at the commits micropython-pydevices pins.
          mkdir -p ws && cd ws
          git clone --quiet --depth 1 --branch "$LVGL_CP_REF" https://github.com/PyDevices/lvgl-circuitpython.git \
            || { git clone --quiet https://github.com/PyDevices/lvgl-circuitpython.git \
                 && git -C lvgl-circuitpython checkout --quiet "$LVGL_CP_REF"; }
          for name in pdwidgets palettes; do
            read -r _ url commit < <(grep "^$name[[:space:]]" ../micropython-pydevices/modules.lock)
            git init --quiet "$name"
            git -C "$name" fetch --quiet --depth 1 "$url" "$commit"
            git -C "$name" checkout --quiet FETCH_HEAD
          done
          ls

      - name: Build ${{ matrix.target }}
        env:
          MPP_DIR: ${{ github.workspace }}/micropython-pydevices
          PYD_DIR: ${{ github.workspace }}/pydevices
          WS_DIR: ${{ github.workspace }}/ws
        run: recipe/scripts/release_interpreters.sh build "${{ matrix.target }}" out

      - uses: actions/upload-artifact@v7
        with:
          name: interpreter-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  assemble:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/micropython-pydevices
          ref: ${{ inputs.micropython-pydevices-ref || 'main' }}
          path: micropython-pydevices
      - uses: actions/download-artifact@v8
        with:
          pattern: interpreter-*
          merge-multiple: true
          path: bin

      - name: Each interpreter starts and carries the modules
        run: |
          # The desktop display's runtime, which the Linux builds link to.
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libffi8
          chmod +x bin/micropython bin/circuitpython
          bin/micropython -c "import sys; print(sys.version); import displaydev, appdev, lvgl, ulab, synthio, audiopump, audiosampler; print('micropython modules ok')"
          bin/circuitpython -c "import sys; print(sys.version); import pygraphics, lvgl; print(sys.implementation.name, 'modules ok')"
          file bin/micropython.exe | tee /dev/stderr | grep -q 'PE32+'
          cd bin && node --input-type=module -e "
            import { loadMicroPython } from './micropython.mjs';
            const mp = await loadMicroPython();
            mp.runPython('import sys; print(sys.version); import displaydev; print(\"wasm ok\")');
          "

      - name: Write interpreters.json
        env:
          TAG: ${{ needs.gate.outputs.tag || 'unreleased' }}
          DRY_RUN: ${{ needs.gate.outputs.attach == 'true' && '0' || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mpp=$(git -C micropython-pydevices rev-parse --short=12 HEAD)
          export PROVENANCE="built by GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_REPOSITORY $GITHUB_SHA with micropython-pydevices $mpp"
          # Writes the manifest; uploads only when this run attaches.
          bin/upload_interpreters.sh "$TAG" --clobber
          cat bin/interpreters.json

      - uses: actions/upload-artifact@v7
        with:
          name: interpreters
          path: |
            bin/micropython
            bin/micropython.exe
            bin/circuitpython
            bin/micropython.mjs
            bin/micropython.wasm
            bin/interpreters.json
          if-no-files-found: error
