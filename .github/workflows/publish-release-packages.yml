name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v5
    with:
      build-kind: pydevices-multi
      distribution-name: pydevices
      mip-profile: pydevices
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit
