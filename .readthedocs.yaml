# Read the Docs builds the pydevices library's site from this file. The
# palettes and pdwidgets sites in this repository have their own, in their
# folders.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
