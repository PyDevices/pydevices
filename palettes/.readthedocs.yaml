# Read the Docs builds this site from the pydevices repository, with this
# file as the project's configuration file (Settings, "Path for
# .readthedocs.yaml": palettes/.readthedocs.yaml). Paths here are relative to the
# repository root, not to this folder.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: palettes/mkdocs.yml

python:
  install:
    - requirements: palettes/docs/requirements.txt
