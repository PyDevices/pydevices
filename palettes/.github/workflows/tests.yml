name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'palettes.toml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'palettes.toml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: lib
        run: python -m unittest discover -s tests

      # Google style only, no Sphinx directives: the org convention at
      # dotgithub/docs/docstrings.md, written so the generated reference pages
      # stay accurate. 28 roles once reached the published page as literal
      # ":meth:" text (#16).
      - name: Docstring style (no Sphinx roles)
        run: |
          if grep -rnoE ':(meth|class|attr|func|mod|exc|data|obj):`' lib --include='*.py'; then
            echo "::error::Sphinx roles in docstrings; use [Name][path] or plain backticks"
            exit 1
          fi
          echo "no Sphinx roles"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install docs requirements
        run: pip install -r docs/requirements.txt
      # strict:true in mkdocs.yml turns a warning into a failure, so an
      # unresolved cross-reference cannot reach the published page.
      - name: Build docs
        env:
          PYTHONPATH: lib
        run: |
          mkdocs build 2>&1 | tee build.log
          if grep -i griffe build.log; then
            echo "::error::griffe complained; the reference page will be wrong"
            exit 1
          fi

  validate-pyscript-filesystem-toml:
    uses: PyDevices/.github/.github/workflows/reusable-validate-pyscript-filesystem-toml.yml@publishing-v6
    with:
      config-path: palettes.toml
      source-mappings: lib=/lib
