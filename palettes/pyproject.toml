[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-palettes"
dynamic = ["version"]
description = "Pure-Python color palette toolkit for PyDevices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Brad Barnett" }]
urls = { Homepage = "https://github.com/PyDevices/palettes", Issues = "https://github.com/PyDevices/palettes/issues" }

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
lint.select = ["E", "F", "I", "W", "B", "SIM", "PLC0415"]
lint.ignore = ["E501", "F401", "F403", "F405", "ISC003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
