# The driver packages: one table per package, named by its module.
#
# Each publishes to the package index under its name, at its own version.
# `modules` are the files it installs (flat, into the board's lib folder);
# `requires` names other driver packages it imports. A board package names
# the drivers it uses with require() in its manifest.py. Bump `version`
# when you change a driver. `native = true` marks a module OmniPython
# firmware builds in (the display buses): its package is the pure-Python
# version for other firmware, and a board needn't require it. See
# CONTRIBUTING.md.

# Files under drivers/ that are not packages: CircuitPython-only copies,
# work in progress, and the community folder.
unpublished = [
    "display/community/",
    "display/work_in_progress/",
    "touch/circuitpython/",
    "bus/_rp2_wip.py",
    "display/st7796_test.py",
]

